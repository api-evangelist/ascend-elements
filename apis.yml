aid: ascend-elements
name: Ascend Elements
description: 'Ascend Elements is a Westborough, Massachusetts battery materials company that
  manufactures engineered lithium-ion battery materials from valuable elements reclaimed from
  spent lithium-ion batteries and gigafactory manufacturing scrap. Founded in 2015 as Battery
  Resourcers out of MIT-affiliated research by Eric Gratz and Professor Yan Wang, it recovers up
  to 98% of the critical battery metals in end-of-life cells and uses its patented
  Hydro-to-Cathode direct cathode precursor (pCAM) synthesis process to produce cathode precursor
  and battery-grade lithium carbonate, reducing the carbon footprint of new EV battery cathode
  material by up to 90%. Its Base 1 facility in Covington, Georgia is North America''s largest
  electric-vehicle battery recycling plant, and Apex 1 in Hopkinsville, Kentucky is its
  commercial pCAM plant. Ascend Elements publishes no public developer API for its materials,
  recycling or logistics business; the only machine-readable surface observed on its own hosts is
  the WordPress REST API at ascendelements.com/wp-json, which serves the corporate website''s
  content, media-coverage, jobs and supplier sourcing-event collections.'
