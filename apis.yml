apis:
- name: Ascend Elements WordPress REST API
  description: 'The WordPress REST API surface published by Ascend Elements at
    ascendelements.com/wp-json — 362 routes across 20 namespaces. The anonymously readable core is
    the wp/v2 content surface (posts, pages, media, categories, tags, users, comments, search,
    types, taxonomies, statuses) plus three company-specific custom post types: media_coverage
    (61 items of press coverage), sourcing-events (open supplier bid packages for the Apex 1
    plant) and job (the careers board, currently empty) with its job_category and job_location
    taxonomies. This is the corporate website''s content/CMS surface, not a product API for
    Ascend Elements'' battery materials, recycling or logistics business — the company ships no
    public developer API for those. The OpenAPI in this repo was derived mechanically from the
    live route index and from JSON Schemas returned by HTTP OPTIONS on the readable collections.'
  humanURL: https://ascendelements.com/wp-json/
  baseURL: https://ascendelements.com/wp-json
