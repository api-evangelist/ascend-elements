error_envelope:
  format: proprietary JSON (not RFC 9457 application/problem+json)
  content_type: application/json
  shape:
    code: machine-readable string, e.g. rest_forbidden, rest_cannot_view, rest_no_route
    message: human-readable string
    data.status: HTTP status code repeated in the body
    data.params: per-parameter validation messages (validation errors only)
  cross_reference: errors/ascend-elements-problem-types.yml
rate_limiting:
  signaled: false
  api_surface_note: >-
    No X-RateLimit-* or Retry-After headers were observed on any /wp-json/ response.
  front_end_note: >-
    The HTML front end is a different story and is worth recording: every non-/wp-json/ path
    on ascendelements.com returns HTTP 503 with `Retry-After: 600` to non-browser clients.
    That is bot protection on the website, not a documented API rate limit, and it does not
    apply to the REST API.
caching:
  cache_control: 'max-age=600, must-revalidate (observed on wp/v2 collections)'
  headers_observed: [x-cacheable, x-cache, x-cache-group, cf-cache-status]
  note: 'x-cacheable: SHORT; edge is Cloudflare in front of WP Engine'
cors:
  access_control_allow_headers: [Authorization, X-WP-Nonce, Content-Disposition, Content-MD5, Content-Type]
  access_control_expose_headers: [X-WP-Total, X-WP-TotalPages, Link]
method_override:
  supported: true
  header: X-HTTP-Method-Override
  note: standard WordPress REST behaviour for clients that cannot send PUT/PATCH/DELETE
batching:
