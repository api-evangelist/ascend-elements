    pages: 10
    media_coverage: 61
    sourcing-events: 4
    job: 0
sparse_fieldsets:
  supported: true
  param: _fields
  note: 'comma-separated property list, e.g. ?_fields=id,slug,link,title — verified live'
expansion:
  supported: true
  param: _embed
  note: >-
    HAL-style _links on every resource (self, collection, about, author, replies,
    wp:featuredmedia, wp:term, curies); ?_embed=1 inlines the linked resources under _embedded.
context_shaping:
  param: context
  enum: [view, embed, edit]
  note: controls which schema properties are returned; edit requires authentication
metadata:
  supported: true
  field: meta
  note: wp/v2 content types expose a `meta` object on create/update requests
request_tracing:
  request_id_header: null
  note: >-
    No request-id or correlation-id header is returned. The Cloudflare edge does return a
    `cf-ray` identifier, which is an edge trace token rather than an application request id.
