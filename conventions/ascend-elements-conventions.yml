source: openapi/ascend-elements-wordpress-rest-openapi.yml + live probes of
  https://ascendelements.com/wp-json/wp/v2/posts
api: Ascend Elements WordPress REST API
scope: >-
  Cross-cutting request/response semantics observed on the WordPress REST API published at
  ascendelements.com/wp-json. Everything below was either read out of the live route index or
  observed on a live request/response against this host on 2026-08-02.
authentication:
  anonymous_read: true
  note: >-
    Published content collections (wp/v2 posts, pages, media, categories, tags, users,
    comments, search, plus the site's job, job_category, job_location, media_coverage and
    sourcing-events custom types) read anonymously. The wp-abilities/v1 namespace and the
    menus/menu-items routes return 401 rest_forbidden / rest_cannot_view without credentials,
    and the `Allow` header on wp/v2/posts is `GET` only for an unauthenticated caller.
  schemes:
  - Application Passwords (HTTP Basic) — advertised in the route index at
    authentication.application-passwords; authorize at
    https://ascendelements.com/wp-admin/authorize-application.php
  - Cookie + X-WP-Nonce header — same-origin first-party callers only
  cross_reference: authentication/ascend-elements-authentication.yml
idempotency:
  supported: false
  note: >-
    No idempotency key header or parameter is documented or present in the route index. Writes
    are plain REST semantics (POST creates, PUT/PATCH update, DELETE removes), and writes are
    not available anonymously in any case. No Idempotency pointer is emitted for this provider
    — emitting one would claim an idempotency contract that does not exist.
pagination:
  style: page-number
  request_params:
  - name: page
    default: 1
  - name: per_page
    default: 10
    max: 100
  - name: offset
  - name: order
    enum: [asc, desc]
  - name: orderby
  response_headers:
  - X-WP-Total
  - X-WP-TotalPages
  link_header: 'RFC 8288 Link header with rel="next" / rel="prev", e.g.
    <https://ascendelements.com/wp-json/wp/v2/posts?per_page=2&page=2>; rel="next"'
  observed:
