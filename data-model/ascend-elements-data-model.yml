    Electrical packages.
  key_fields: [id, date, modified, slug, status, link, title, content, featured_media, meta]
- name: Job
  collection: /wp/v2/job
  id_field: id
  id_type: integer
  count_observed: 0
  custom_post_type: true
  description: Careers board custom post type. Registered and readable, but currently empty.
  key_fields: [id, date, modified, slug, status, link, title, content, job_category,
