api: Ascend Elements WordPress REST API
scope: >-
  Entity-relationship graph of the anonymously readable content core. Derived from the JSON
  Schemas the host returns on HTTP OPTIONS and from the id-reference fields in those schemas.
  The company-specific entities are MediaCoverage, SourcingEvent and Job — those are the three
  custom post types Ascend Elements added to the stock WordPress model.
entities:
- name: Post
  collection: /wp/v2/posts
  id_field: id
  id_type: integer
  count_observed: 66
  description: Company news and press releases.
  key_fields: [id, date, modified, slug, status, link, title, content, excerpt, author,
    featured_media, categories, tags, meta, format, sticky]
- name: Page
  collection: /wp/v2/pages
  id_field: id
  id_type: integer
  count_observed: 10
  description: Static site pages (Home, About Us, Innovation, Products, Services, Recycling,
    Become a Supplier, Corporate Policies, Employee Engagement, Opt-out preferences).
  key_fields: [id, date, modified, slug, status, link, title, content, author, parent,
    featured_media, menu_order, template]
- name: MediaCoverage
  collection: /wp/v2/media_coverage
  id_field: id
  id_type: integer
  count_observed: 61
  custom_post_type: true
  description: Third-party press coverage of Ascend Elements — a company-specific custom post
    type, not a WordPress core collection.
  key_fields: [id, date, modified, slug, status, link, title, content, featured_media, meta]
- name: SourcingEvent
  collection: /wp/v2/sourcing-events
  id_field: id
  id_type: integer
  count_observed: 4
  custom_post_type: true
  description: >-
