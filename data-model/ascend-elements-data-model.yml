    Global Supply Chain, Science & Technology, All Positions.
  key_fields: [id, count, description, link, name, slug, taxonomy, parent]
- name: JobLocation
  collection: /wp/v2/job_location
  id_field: id
  id_type: integer
  taxonomy: true
  description: >-
    Facility taxonomy — this doubles as Ascend Elements' published site list. Observed terms:
    Covington GA (Base 1), Hopkinsville KY (Apex 1), Novi MI, Westborough MA (HQ/R&D), Global.
  key_fields: [id, count, description, link, name, slug, taxonomy, parent]
- name: MediaItem
  collection: /wp/v2/media
  id_field: id
