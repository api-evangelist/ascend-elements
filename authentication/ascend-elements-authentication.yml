schemes:
- name: applicationPassword
  type: http
  scheme: basic
  description: >-
    WordPress Application Passwords, advertised by the route index at
    https://ascendelements.com/wp-json/ under authentication.application-passwords. A site
    administrator issues a per-application password at
    https://ascendelements.com/wp-admin/authorize-application.php and the client presents it
    as HTTP Basic (username + application password) on the Authorization header. This is the
    only programmatic credential the host advertises.
  sources:
  - openapi/ascend-elements-wordpress-rest-openapi.yml
- name: cookieNonce
  type: apiKey
  in: header
  parameter_name: X-WP-Nonce
  description: >-
    WordPress cookie authentication paired with a nonce on the X-WP-Nonce header — the
    first-party, same-origin scheme used by the site's own admin/editor JavaScript. Advertised
    indirectly via the access-control-allow-headers response header
    (`Authorization, X-WP-Nonce, Content-Disposition, Content-MD5, Content-Type`). Not usable
    by third-party server-side clients.
  sources:
  - openapi/ascend-elements-wordpress-rest-openapi.yml
notes: >-
  Ascend Elements publishes no developer API programme, so there is no signup, no API key
  issuance flow and no developer portal. Everything above is the stock WordPress
  authentication surface of the corporate website, verified live. No OAuthScopes artifact is
  emitted for this provider: there is no OAuth surface, and per the enrichment contract
  scopes/ is OAuth-only rather than a forced empty file.
