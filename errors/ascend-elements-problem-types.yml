format_note: >-
  NOT RFC 9457. The WordPress REST API returns application/json with a proprietary
  {code, message, data:{status}} envelope rather than application/problem+json. Recorded here
  so an agent knows to parse `code`, not `type`/`title`/`detail`.
envelope:
  content_type: application/json
  fields:
    code: machine-readable error slug
    message: human-readable message
    data.status: HTTP status repeated in the body
    data.params: map of parameter name to validation message (validation failures only)
